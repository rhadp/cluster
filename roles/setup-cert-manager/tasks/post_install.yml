

- name: configure ingress controller to use the certificate
  k8s:
    definition:
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        defaultCertificate:
          name: default-ingress-cert
    state: present
    merge_type: merge
    kubeconfig: "{{ local_kubeconfig_file }}"

- name: install cert-manager openshift-routes integration
  shell: |
    helm upgrade --install openshift-routes \
      oci://ghcr.io/cert-manager/charts/openshift-routes \
      -n {{ cert_manager_namespace }} \
      --kubeconfig "$HOME/.kube/{{ cluster_fqn }}"
  register: r_openshift_routes
  changed_when: "'STATUS: deployed' in r_openshift_routes.stdout"