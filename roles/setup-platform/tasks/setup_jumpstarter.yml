# Implement your install deployment tasks here
# -------------------------------------------------

- name: create jumpstarter namespace and stuff
  k8s:
    definition: "{{ lookup('template', item ) | from_yaml }}"
    state: present
    apply: yes
    kubeconfig: "{{ local_kubeconfig_file }}"
  loop:
    - app-jumpstarter.yml.j2

- name: wait for the jumpstarter app to be ready
  k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: auto-jumpstarter
    namespace: "{{ gitops_namespace }}"
    kubeconfig: "{{ local_kubeconfig_file }}"
  register: r_application
  retries: 180
  delay: 10
  until:
    - r_application.resources | length > 0
    - r_application.resources[0].status is defined
    - r_application.resources[0].status.sync is defined
    - r_application.resources[0].status.sync.status is defined
    - r_application.resources[0].status.sync.status == 'Synced'

- name: pause to allow the operator to settle
  pause:
    seconds: 120

- name: extract the ingress ca certificate
  #shell: |
  #  oc get secret -n openshift-ingress-operator router-ca -o jsonpath='{.data.tls\.crt}' \
  #  --kubeconfig="$HOME/.kube/{{ cluster_fqn }}"
  shell: |
    openssl s_client -connect keycloak-{{ platform_keycloak_namespace }}.apps.{{ cluster_base_domain }}:443 -showcerts </dev/null 2>/dev/null | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/{print}'
  register: output

- name: set fact ingress ca certificate
  set_fact:
    ingress_ca_certificate: "{{ output.stdout }}"
  when:
    - output is succeeded

- name: create jumpstarter controller
  k8s:
    definition: "{{ lookup('template', item ) | from_yaml }}"
    state: present
    apply: yes
    kubeconfig: "{{ local_kubeconfig_file }}"
  loop:
    - jumpstarter-jumpstarter.yml.j2

# TODO: wait until the login route is ready
- name: wait for the login route to be ready
  k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: login-route
    namespace: "{{ platform_jumpstarter_namespace }}"
    kubeconfig: "{{ local_kubeconfig_file }}"
  register: r_route
  retries: 180
  delay: 10
  until: r_route.resources | length > 0

- name: annotate login route for cert-manager
  k8s:
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: login-route
        namespace: "{{ platform_jumpstarter_namespace }}"
        annotations:
          cert-manager.io/issuer-name: letsencrypt-prod
          cert-manager.io/issuer-kind: ClusterIssuer
    state: present
    merge_type: merge
    kubeconfig: "{{ local_kubeconfig_file }}"
