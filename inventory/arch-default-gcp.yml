all:
  # default values that control the cluster architecture on Google Cloud Platform
  # default: multi-arch, default topology, 3x amd64 control plane, 2x amd64 worker nodes, additional arm64 worker nodes are possible (virt only)
  vars:
    # cloud provider selection
    cloud_provider: "gcp" # aws, azure, gcp

    # cluster version
    cluster_version: "{{ lookup('env', 'CLUSTER_VERSION') }}"

    # cluster topology
    cluster_arch: "multi" # x86_64, aarch64, multi -> multi is only available on aws & azure !
    control_plane_arch: "amd64" #  amd64, arm64, -> only relevant when cluster_arch == multi
    cluster_topology: "default" # default, compact

    cluster_default_storage_class: "standard-csi" # "gp3-csi" (aws), "managed-csi" (azure), "standard-csi" (gcp)
    
    # installer architecture, see https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.22.5/
    installer_architecture: "{{ lookup('env', 'INSTALLER_ARCHITECTURE') | default('mac-arm64', true) }}" # mac, mac-arm64, linux, linux-arm64